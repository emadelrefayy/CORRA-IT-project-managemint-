name: Build Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Verify dependencies
        run: npm ls react react-dom react-router-dom lucide-react @supabase/supabase-js

      - name: Build
        run: npm run build